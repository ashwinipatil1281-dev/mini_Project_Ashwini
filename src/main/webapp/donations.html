
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiveTrack | Donation Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Give<span>Track</span></div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="donors.html">Donors</a>
        <a href="beneficiaries.html">Beneficiaries</a>
        <a href="donations.html">Donations</a>
        <a href="allocations.html">Allocations</a>
        <a href="index.html">Logout</a>
    </nav>
</header>

<main class="dashboard">

    <div class="dashboard-heading">
        <div>
            <h1>Donation Management</h1>
            <p>Record and manage community donations.</p>
        </div>
    </div>

    <section class="dashboard-section">
        <h2>Record New Donation</h2>

        <form id="donationForm">

            <label for="donorId">Donor ID</label>
            <input type="number" id="donorId"
                   placeholder="Enter donor ID" min="1" required>

            <label for="donationAmount">Donation Amount (₹)</label>
            <input type="number" id="donationAmount"
                   placeholder="Enter amount" min="0.01"
                   step="0.01" required>

            <label for="donationDate">Donation Date</label>
            <input type="date" id="donationDate" required>

            <label for="paymentMode">Payment Mode</label>
            <select id="paymentMode" required>
                <option value="">Select payment mode</option>
                <option value="CASH">Cash</option>
                <option value="UPI">UPI</option>
                <option value="BANK_TRANSFER">Bank Transfer</option>
                <option value="CHEQUE">Cheque</option>
            </select>

            <label for="donationPurpose">Purpose</label>
            <input type="text" id="donationPurpose"
                   placeholder="Enter donation purpose" required>

            <button type="submit">Record Donation</button>

            <p id="donationMessage"></p>

        </form>
    </section>

    <!-- DONATION SEARCH SECTION -->
    <section class="dashboard-section">
        <h2>Search Donation Records</h2>

        <div class="search-container">
            <input
                type="text"
                id="donationSearch"
                placeholder="Search by donor ID, amount, date, payment mode or purpose">

            <button type="button" onclick="searchDonations()">
                Search
            </button>
        </div>

        <p id="searchMessage"></p>
        <div id="searchResults"></div>
    </section>

    <!-- DONATION RECORDS -->
    <section class="dashboard-section">
        <h2>Donation Records</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Donation ID</th>
                        <th>Donor ID</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Payment Mode</th>
                        <th>Purpose</th>
                    </tr>
                </thead>

                <tbody id="donationTableBody">
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    <p>© 2026 GiveTrack | Community Donation Ledger</p>
</footer>

<script src="js/donations.js"></script>

</body>
</html>
